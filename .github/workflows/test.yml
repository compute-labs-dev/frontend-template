name: Test Templates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read

concurrency:
  group: test-templates-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-structure:
    runs-on: ubuntu-latest
    name: Validate Template Structure
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install

    - name: Run structure tests
      run: node test-templates.js

  test-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        template: [standard, ai, web3]

    name: Build ${{ matrix.template }} on Node ${{ matrix.node }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}

    # Mirrors create.js: copy base, overlay the optional template, merge its
    # package.json.snippet dependencies.
    - name: Create test project
      env:
        TEMPLATE: ${{ matrix.template }}
      run: |
        out="test-output/test-$TEMPLATE"
        mkdir -p "$out"
        cp -r base/. "$out/"
        case "$TEMPLATE" in
          ai) optional=optional/ai-structured ;;
          web3) optional=optional/web3-solana-starter ;;
          *) optional="" ;;
        esac
        if [ -n "$optional" ]; then
          cp -r "$optional/." "$out/"
          rm -f "$out/package.json.snippet"
          node -e '
            const fs = require("fs");
            const [pkgPath, snippetPath] = process.argv.slice(1);
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const snippet = JSON.parse(fs.readFileSync(snippetPath, "utf8"));
            for (const key of ["dependencies", "devDependencies"]) {
              if (snippet[key]) pkg[key] = { ...pkg[key], ...snippet[key] };
            }
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          ' "$out/package.json" "$optional/package.json.snippet"
        fi

    - name: Check required files
      working-directory: test-output/test-${{ matrix.template }}
      run: |
        for file in package.json tsconfig.json next.config.mjs tailwind.config.ts; do
          if [ ! -f "$file" ]; then
            echo "Missing required file: $file"
            exit 1
          fi
        done

    - name: Install project dependencies
      working-directory: test-output/test-${{ matrix.template }}
      run: npm install --no-audit --no-fund

    - name: Run build
      working-directory: test-output/test-${{ matrix.template }}
      run: npm run build

  release:
    needs: [test-structure, test-templates]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm install

    - name: Publish to npm
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
